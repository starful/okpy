{# Amazon Associates + Rakuten Affiliate — category search CTA #}
{% if amazon_search_url %}
<aside class="amazon-box" aria-label="アフィリエイトリンク">
    <p class="amazon-box__title">関連書籍</p>
    <p class="amazon-box__desc">
        この記事のトピックに関連する本を Amazon / 楽天で探せます。
    </p>
    <div class="amazon-box__actions">
        <a class="amazon-box__btn"
           href="{{ amazon_search_url }}"
           target="_blank"
           rel="nofollow sponsored noopener noreferrer">
            {{ amazon_button_label }}
        </a>
        {% if rakuten_search_url %}
        <a class="amazon-box__btn amazon-box__btn--rakuten"
           href="{{ rakuten_search_url }}"
           target="_blank"
           rel="nofollow sponsored noopener noreferrer">
            {{ rakuten_button_label }}
        </a>
        {% endif %}
    </div>
    <p class="amazon-box__note">
        Amazonのアソシエイトとして、また楽天アフィリエイトとして、OKPyは適格販売により収入を得ています。
    </p>
</aside>
{% endif %}
